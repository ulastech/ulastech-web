name: Generate Daily Tech Article

on:
  schedule:
    # Jalan 2x sehari:
    # 00:00 UTC = 07:00 WIB (pagi)
    - cron: "0 0 * * *"
    # 09:00 UTC = 16:00 WIB (sore)
    - cron: "0 9 * * *"
  workflow_dispatch: {}   # supaya bisa dijalankan manual dari tab Actions

permissions:
  contents: write

jobs:
  generate-article:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate artikel baru
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: node scripts/generate-daily-article.mjs

      - name: Commit & push perubahan
        run: |
          git config user.name "ulastech-bot"
          git config user.email "bot@ulastech.local"
          git add data/articles.json
          git diff --cached --quiet || git commit -m "Auto: artikel teknologi harian $(date +'%Y-%m-%d')"
          git push
